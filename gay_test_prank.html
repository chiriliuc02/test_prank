<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Тест</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
.screen{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.box{width:100%;max-width:430px}
h1{font-size:32px;margin:0 0 38px;line-height:1.15}
button{width:100%;padding:18px;border:0;border-radius:14px;background:#fff;color:#000;font-size:20px;font-weight:700}
#scan{display:none;position:fixed;inset:0;background:#000}
#camera{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.percent{font-size:52px;font-weight:800;text-shadow:0 2px 10px #000;margin-bottom:22px}
.label{font-size:18px;text-shadow:0 2px 8px #000}
.frame{width:72vw;height:72vw;max-width:330px;max-height:330px;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 9999px rgba(0,0,0,.25)}
#result{display:none}
.resultTitle{font-size:18px;margin-bottom:18px}
.result{font-size:46px;font-weight:900;line-height:1.05}
.note{font-size:13px;color:#999;margin-top:25px}
</style>
</head>
<body>

<div id="start" class="screen">
  <div class="box">
    <h1>Пройти тест на пидора</h1>
    <button id="continue">Продолжить</button>
  </div>
</div>

<div id="scan">
  <video id="camera" autoplay playsinline muted></video>
  <div class="overlay">
    <div class="percent" id="percent">0%</div>
    <div class="frame"></div>
    <div class="label" id="status">Подготовка сканирования...</div>
  </div>
</div>

<div id="result" class="screen">
  <div class="box">
    <div class="resultTitle">Результат анализа</div>
    <div class="result">ВЫ 100%<br>ПИДОР</div>
    <div class="note"></div>
  </div>
</div>

<script>
const start=document.getElementById('start');
const scan=document.getElementById('scan');
const result=document.getElementById('result');
const button=document.getElementById('continue');
const camera=document.getElementById('camera');
const percent=document.getElementById('percent');
const status=document.getElementById('status');

let stream=null;

button.addEventListener('click', async ()=>{
  start.style.display='none';
  scan.style.display='block';

  try {
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'user'},
      audio:false
    });
    camera.srcObject=stream;
  } catch(e) {
    status.textContent='Сканирование без камеры...';
  }

  const steps=[
    [3,'Поиск лица...'],
    [17,'Определение параметров...'],
    [31,'Анализ мимики...'],
    [48,'Проверка характера...'],
    [67,'Сопоставление данных...'],
    [82,'Почти готово...'],
    [94,'Финальный анализ...'],
    [100,'Анализ завершён']
  ];

  let i=0;
  const timer=setInterval(()=>{
    percent.textContent=steps[i][0]+'%';
    status.textContent=steps[i][1];
    i++;

    if(i>=steps.length){
      clearInterval(timer);
      setTimeout(showResult,900);
    }
  },650);
});

function showResult(){
  if(stream) stream.getTracks().forEach(track=>track.stop());
  scan.style.display='none';
  result.style.display='flex';
}
</script>

</body>
</html>
